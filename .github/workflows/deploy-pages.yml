name: Publish playable demo to GitHub Pages
on:
  workflow_run:
    workflows: ["ATLAS Quality Gate"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: atlas-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Verify all ATLAS content and candidates again
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m atlas.gate --root .
          python -m atlas.candidate_visuals --root .
          python -m atlas.candidate_lexicon --root .
      - name: Build safe static site from fixed assets
        run: python -m tools.build_site --root . --output dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
