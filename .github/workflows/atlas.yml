name: ATLAS Quality Gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atlas-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install offline validator dependencies
        run: python -m pip install -r requirements.txt
      - name: Rejection unit tests
        run: python -m unittest discover -s tests -v
      - name: Audit publication manifest
        run: python -m atlas.gate --root .
      - name: Validate and render candidate art
        run: python -m atlas.candidate_visuals --root .
      - name: Audit multilingual curriculum candidates
        run: python -m atlas.candidate_lexicon --root .
      - name: Build playable web demo
        run: python -m tools.build_site --root . --output dist
      - name: Install Node for browser tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: node --check site/app.js && node --check site/practice.js && node --check site/data/demo-content.js
      - name: Validate reusable learning engine
        run: node --test tests/continuous_learning.test.mjs
      - name: Validate reusable written-recall practice
        run: node --test tests/practice_engine.test.cjs
      - name: Install browser test runner
        run: npm install --no-audit --no-fund
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright mobile and desktop tests
        run: npm run test:e2e
      - name: Attach evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-quality-report
          path: |
            reports/
            test-results/
          retention-days: 7
          if-no-files-found: warn
